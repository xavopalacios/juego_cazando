<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juego Cazando - Dota Edition</title>
  <link rel="stylesheet" href="cazando.css">
  <script src="utils.js"></script>
</head>
<body onload="iniciarJuego()">

  <div class="main-wrapper">
    <header>
      <h1 id="titulo">⚔️ CAZANDO ⚔️</h1>
      <p id="autor">🛡️ Autor: Matemático</p>
    </header>

    <div class="panel">
      <div class="stat-card">
        <span class="label">PUNTOS</span>
        <span id="puntos">0</span>
      </div>
      
      <button id="btn-reiniciar" onclick="reiniciarJuego()">REINICIAR</button>

      <div class="stat-card">
        <span class="label">TIEMPO</span>
        <span id="tiempo">10</span>
      </div>
    </div>

    <canvas id="areaJuego" width="500" height="500"></canvas>

    <p id="mensaje"></p>

    <div class="controles">
      <div class="dpad">
        <button class="btn-dota" onclick="moverArriba()">▲</button>
        <div class="row">
          <button class="btn-dota" onclick="moverIzquierda()">◀</button>
          <button class="btn-dota" onclick="moverAbajo()">▼</button>
          <button class="btn-dota" onclick="moverDerecha()">▶</button>
        </div>
      </div>
    </div>
  </div>

  <script src="cazando.js"></script>
</body>
</html>
